# 可选：挂到「已经占用 80 的那个 Nginx」上（有域名时推荐）
# 例：浏览器访问 http://zhiliu.example.com  （把 example.com 换成你的域名）
#
# 1) 阿里云 DNS：加 A 记录  主机记录 zhiliu  →  记录值 = ECS 公网 IP
# 2) 把本文件里的 server_name 改成你的真实域名后，拷到现有 Nginx：
#      sudo cp deploy/nginx-via-existing-80.conf /etc/nginx/sites-available/zhiliu
#      # 编辑 server_name
#      sudo ln -sfn /etc/nginx/sites-available/zhiliu /etc/nginx/sites-enabled/zhiliu
#      sudo nginx -t && sudo systemctl reload nginx
# 3) AgentFlow 本站仍监听 127.0.0.1:8080（deploy/nginx.conf）

server {
    listen 80;
    server_name zhiliu.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
