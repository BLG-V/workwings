# 智流 AgentFlow — Nginx 站点配置
# 默认监听 8080，避免和同机已占用 80 的项目冲突。
# 首次安装可改：HTTP_PORT=80 sudo bash deploy/setup-ubuntu.sh
# 有域名后可把 server_name 改成 agentflow.example.com，并在「现有 80 的 Nginx」里反代过来。

upstream mawp_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/agentflow/dist;
    index index.html;

    client_max_body_size 32m;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /api/mawp/ {
        proxy_pass http://mawp_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/deepseek/ {
        proxy_pass https://api.deepseek.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.deepseek.com;
        include /etc/nginx/snippets/agentflow-secrets-deepseek.conf;
        proxy_set_header Accept $http_accept;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no always;
    }

    location /api/bocha/ {
        proxy_pass https://api.bochaai.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bochaai.com;
        include /etc/nginx/snippets/agentflow-secrets-bocha.conf;
        proxy_read_timeout 120s;
    }

    location /api/pollinations/ {
        proxy_pass https://gen.pollinations.ai/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host gen.pollinations.ai;
        include /etc/nginx/snippets/agentflow-secrets-pollinations.conf;
        proxy_read_timeout 180s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
