# 不买域名：用 nip.io 免费 HTTPS
# IP 47.94.238.221 → 域名 47-94-238-221.nip.io（自动解析到该 IP）
#
# 前提：AgentFlow 已在 127.0.0.1:8888 运行；本机 80 端口已有其它项目（共用系统 Nginx）
#
# 安装：
#   sudo bash deploy/setup-nipio-https.sh
#
# 访问：https://47-94-238-221.nip.io/

# HTTP：证书申请 + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 47-94-238-221.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：反代到 AgentFlow（8888）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 47-94-238-221.nip.io;

    # certbot 申请后会自动填入；首次可先注释 ssl 两行跑 certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/47-94-238-221.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47-94-238-221.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
