# 智流 AgentFlow — zhiliu.cyou HTTPS
# 勿重复定义 upstream mawp_api（8888 站点可能已有），直接 proxy 到 8787

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zhiliu.cyou www.zhiliu.cyou;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhiliu.cyou www.zhiliu.cyou;

    ssl_certificate     /etc/nginx/ssl/zhiliu.cyou.pem;
    ssl_certificate_key /etc/nginx/ssl/zhiliu.cyou.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /opt/agentflow/dist;
    index index.html;
    client_max_body_size 32m;

    # 带 hash 的静态资源可长期缓存；index.html 禁止缓存，避免发版后首屏样式错乱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /api/mawp/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/deepseek/ {
        proxy_pass https://api.deepseek.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.deepseek.com;
        include /etc/nginx/snippets/agentflow-secrets-deepseek.conf;
        proxy_set_header Accept $http_accept;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no always;
    }

    location /api/bocha/ {
        proxy_pass https://api.bochaai.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bochaai.com;
        include /etc/nginx/snippets/agentflow-secrets-bocha.conf;
        proxy_read_timeout 120s;
    }

    location /api/pollinations/ {
        proxy_pass https://gen.pollinations.ai/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host gen.pollinations.ai;
        include /etc/nginx/snippets/agentflow-secrets-pollinations.conf;
        proxy_read_timeout 180s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
