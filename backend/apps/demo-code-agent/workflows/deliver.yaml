# App 侧 deliver · 对齐 A 契约 + Requirement / Frontend（AC-08）
#
# 字段契约：docs/w4-ad-deliver-yaml-align.md（outputs 键名勿改）
# 引擎样例参考：examples/deliver/workflow.yaml
#
# 主链：
#   start → planner → requirement → coding → frontend → testing → check_test
#        ├─ fail → debug → testing   # loop: true
#        └─ pass → review → check_review
#             ├─ blocking → human_review → ship → end
#             └─ pass → ship → end

id: demo-code-agent-deliver
name: Demo Code Agent · Deliver (8 Agent + Generated Page)
version: "0.2.0"
entry: start
default_loop_max: 8

params:
  goal: "AC-08 deliver with frontend page"
  pass_on_attempt: 1
  review_status: pass
  project_mode: false
  frontend_dir: "apps/demo-code-agent/frontend"
  node_max_retries: 2
  node_retry_delay: 2.0
  debug_max_attempts: 2
  self_heal: true
  heal_max_rounds: 1
  heal_on_review_blocking: true

nodes:
  - id: start
    type: start

  - id: planner
    type: agent
    agent: planner
    input:
      tasks:
        - id: T1
          title: "implement feature from ${params.goal}"
          depends_on: []
        - id: T2
          title: "generate status page (frontend)"
          depends_on: [T1]

  - id: requirement
    type: agent
    agent: requirement
    input:
      summary: "${params.goal}"
      # 引擎 mock 会合并 nodes.planner.outputs.tasks
      spec_ref: "apps/demo-code-agent/samples/uc08-mini-requirement.md"

  - id: coding
    type: agent
    agent: coding
    input: {}

  - id: frontend
    type: agent
    agent: frontend
    input:
      frontend_dir: "${params.frontend_dir}"

  - id: testing
    type: agent
    agent: testing
    input: {}

  - id: check_test
    type: condition

  - id: debug
    type: agent
    agent: debug
    input:
      note: "repair from testing then retest; log=${nodes.testing.outputs.log_summary}"

  - id: review
    type: agent
    agent: review
    input: {}

  - id: check_review
    type: condition

  - id: human_review
    type: human_checkpoint
    reason: "Review blocking（blocking_count=${nodes.review.outputs.blocking_count}），确认是否仍进入 Ship？"
    allowed:
      - approve
      - reject
      - input

  - id: ship
    type: agent
    agent: ship
    input:
      delivery_notes: "Ship ready for ${params.goal} — manual push/merge only; page=${nodes.frontend.outputs.artifacts}"

  - id: end
    type: end

edges:
  - from: start
    to: planner
  - from: planner
    to: requirement
  - from: requirement
    to: coding
  - from: coding
    to: frontend
  - from: frontend
    to: testing
  - from: testing
    to: check_test

  # Testing fail → Debug（project_mode 会回投 Coding 真修）→ Retest
  - from: check_test
    to: debug
    when: "nodes.testing.outputs.passed == false"
  - from: check_test
    to: review
    when: default
  - from: debug
    to: testing
    loop: true
    max_traversals: 2

  # Review blocking：引擎 SelfHealPolicy 先回 coding/debug；满 heal_max_rounds 后再 human
  # Review YAML：blocking → human；通过则 default → ship
  - from: review
    to: check_review
  - from: check_review
    to: human_review
    when: "nodes.review.outputs.status == 'blocking'"
  - from: check_review
    to: ship
    when: default
  - from: human_review
    to: ship
  - from: ship
    to: end
